[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "polymarket-edge-lab"
version = "0.2.0"
description = "GitHub source-checkout offline developer preview for Polymarket research and evidence-audit workflows"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [
    {name = "abriskbreeze"},
    {name = "Lens-less"},
]
keywords = ["polymarket", "prediction-markets", "market-data", "backtesting", "research"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Investment",
]

dependencies = [
    "polymarket-client==0.6.0",
    "python-dotenv",
    "websockets",
    "python-socks[asyncio]",
    "numpy",
    "pandas",
    "pyarrow",  # For Parquet export
    "certifi",
    "requests",
    "fastapi>=0.116,<1",
    "uvicorn>=0.35,<1",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-timeout",
    "httpx>=0.28,<1",
    "mypy>=1.17,<2",
    "ruff>=0.12,<1",
]

[project.scripts]
polymm = "src.profit_system.cli:main"

[project.urls]
Homepage = "https://github.com/Lens-less/polymarket-edge-lab"
Repository = "https://github.com/Lens-less/polymarket-edge-lab"
Documentation = "https://github.com/Lens-less/polymarket-edge-lab/tree/main/docs"
Issues = "https://github.com/Lens-less/polymarket-edge-lab/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
timeout = 120
addopts = "-v --tb=short -m 'not network'"
markers = [
    "network: tests that require live external network access (run explicitly with -m network)",
]

[tool.isort]
profile = "black"
line_length = 100

[tool.black]
line-length = 100
target-version = ['py311']

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
files = ["src/profit_system"]
strict = true
follow_imports = "skip"
warn_unreachable = true
show_error_codes = true

[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "polymarket-edge-lab"
version = "0.1.0"
description = "Public-data-only Polymarket research, replay, and evidence audit lab"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [
    {name = "abriskbreeze"},
    {name = "Lens-less"},
]
keywords = ["polymarket", "prediction-markets", "market-data", "backtesting", "research"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Investment",
]

dependencies = [
    "polymarket-client==0.6.0",
    "python-dotenv",
    "websockets",
    "python-socks[asyncio]",
    "numpy",
    "pandas",
    "pyarrow",  # For Parquet export
    "certifi",
    "requests",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-timeout",
]

[project.urls]
Homepage = "https://github.com/Lens-less/polymarket-edge-lab"
Repository = "https://github.com/Lens-less/polymarket-edge-lab"
Documentation = "https://github.com/Lens-less/polymarket-edge-lab/tree/main/docs"
Issues = "https://github.com/Lens-less/polymarket-edge-lab/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
timeout = 120
addopts = "-v --tb=short -m 'not network'"
markers = [
    "network: tests that require live external network access (run explicitly with -m network)",
]

[tool.isort]
profile = "black"
line_length = 100

[tool.black]
line-length = 100
target-version = ['py311']
